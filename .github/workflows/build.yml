name: build

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'docs/**'
      - 'papers/**'
      - 'rfcs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'papers/**'
      - 'rfcs/**'
      - '*.md'

env:
  SEAL_VERSION: 0.8.1

jobs:
  unix:
    strategy:
      matrix:
        os: [{name: ubuntu, version: ubuntu-latest}, {name: macos, version: macos-latest}, {name: macos-arm, version: macos-14}]
        compiler:
          - name: Clang
            cc: clang
            cxx: clang++
          - name: GCC
            cc: gcc
            cxx: g++
    name: ${{matrix.os.name}} with ${{matrix.compiler.name}}
    runs-on: ${{matrix.os.version}}
    steps:
    - uses: actions/checkout@v1
    - name: work around ASLR+ASAN compatibility
      run: sudo sysctl -w vm.mmap_rnd_bits=28
      if: matrix.os.name == 'ubuntu'
    - name: install seal
      # Conformance's ClassesFuzz runs tests/classes_fuzz with seal 0.8.x (>= 0.8.1) and fails without it
      shell: bash
      run: |
        case "${{runner.os}}-${{runner.arch}}" in
          Linux-X64) asset=linux-x64.tar.gz ;;
          Linux-ARM64) asset=linux-arm64.tar.gz ;;
          macOS-ARM64) asset=macos-darwin-arm64.tar.gz ;;
          Windows-X64) asset=windows-x64.zip ;;
          Windows-ARM64) asset=windows-arm64.zip ;;
          *) echo "::error::seal $SEAL_VERSION has no build for ${{runner.os}}-${{runner.arch}}; set LUWU_SKIP_CLASSES_FUZZ=1 for this job"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/seal"
        mkdir -p "$dir"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$dir/$asset" "https://github.com/seal-runtime/seal/releases/download/v$SEAL_VERSION/seal-v$SEAL_VERSION-$asset"
        case "$asset" in
          *.zip) 7z x -y -o"$dir" "$dir/$asset" >/dev/null ;;
          *) tar -xzf "$dir/$asset" -C "$dir" ;;
        esac
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/seal" --version
    - name: make tests
      run: |
        CC=${{matrix.compiler.cc}} CXX=${{matrix.compiler.cxx}} make -j2 config=sanitize werror=1 native=1 luwu-tests
    - name: run tests
      run: |
        ./luwu-tests
        ./luwu-tests --fflags=true
    - name: run extra conformance tests
      run: |
        ./luwu-tests -ts=Conformance -O2
        ./luwu-tests -ts=Conformance -O2 --fflags=true
        ./luwu-tests -ts=Conformance --codegen
        ./luwu-tests -ts=Conformance --codegen --fflags=true
        ./luwu-tests -ts=Conformance --codegen -O2
        ./luwu-tests -ts=Conformance --codegen -O2 --fflags=true
    - name: make cli
      run: |
         make -j2 config=sanitize werror=1 luwu luwu-analyze luwu-compile # match config with tests to improve build time
         ./luwu tests/conformance/assert.luau
         ./luwu-analyze tests/conformance/assert.luau
         ./luwu-compile tests/conformance/assert.luau

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [Win32, x64]
    steps:
    - uses: actions/checkout@v1
    - name: install seal
      # Conformance's ClassesFuzz runs tests/classes_fuzz with seal 0.8.x (>= 0.8.1) and fails without it
      shell: bash
      run: |
        case "${{runner.os}}-${{runner.arch}}" in
          Linux-X64) asset=linux-x64.tar.gz ;;
          Linux-ARM64) asset=linux-arm64.tar.gz ;;
          macOS-ARM64) asset=macos-darwin-arm64.tar.gz ;;
          Windows-X64) asset=windows-x64.zip ;;
          Windows-ARM64) asset=windows-arm64.zip ;;
          *) echo "::error::seal $SEAL_VERSION has no build for ${{runner.os}}-${{runner.arch}}; set LUWU_SKIP_CLASSES_FUZZ=1 for this job"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/seal"
        mkdir -p "$dir"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$dir/$asset" "https://github.com/seal-runtime/seal/releases/download/v$SEAL_VERSION/seal-v$SEAL_VERSION-$asset"
        case "$asset" in
          *.zip) 7z x -y -o"$dir" "$dir/$asset" >/dev/null ;;
          *) tar -xzf "$dir/$asset" -C "$dir" ;;
        esac
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/seal" --version
    - name: cmake configure
      run: cmake . -A ${{matrix.arch}} -DLUAU_WERROR=ON -DLUAU_NATIVE=ON
    - name: cmake build
      run: cmake --build . --target Luau.UnitTest Luau.Conformance --config Debug
    - name: run tests
      shell: bash # necessary for fail-fast
      run: |
        Debug/Luau.UnitTest.exe
        Debug/Luau.Conformance.exe
        Debug/Luau.UnitTest.exe --fflags=true
        Debug/Luau.Conformance.exe --fflags=true
    - name: run extra conformance tests
      shell: bash # necessary for fail-fast
      run: |
        Debug/Luau.Conformance.exe -O2
        Debug/Luau.Conformance.exe -O2 --fflags=true
        Debug/Luau.Conformance.exe --codegen
        Debug/Luau.Conformance.exe --codegen --fflags=true
        Debug/Luau.Conformance.exe --codegen -O2
        Debug/Luau.Conformance.exe --codegen -O2 --fflags=true
    - name: cmake cli
      shell: bash # necessary for fail-fast
      run: |
        cmake --build . --target Luau.Repl.CLI Luau.Analyze.CLI Luau.Compile.CLI --config Debug # match config with tests to improve build time
        Debug/luwu tests/conformance/assert.luau
        Debug/luwu-analyze tests/conformance/assert.luau
        Debug/luwu-compile tests/conformance/assert.luau

  coverage:
    runs-on: ubuntu-22.04
    env:
      # the classes fuzzer runs in the unix and windows jobs; its luwu processes wouldn't count toward coverage
      LUWU_SKIP_CLASSES_FUZZ: 1
    steps:
    - uses: actions/checkout@v2
    - name: install
      run: |
        sudo apt install llvm
    - name: make coverage
      run: |
        CXX=clang++ make -j2 config=coverage native=1 coverage
    - name: upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.info
        token: ${{ secrets.CODECOV_TOKEN }}

  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - uses: actions/checkout@v2
      with:
        repository: emscripten-core/emsdk
        path: emsdk
    - name: emsdk install
      run: |
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest
    - name: make
      run: |
        source emsdk/emsdk_env.sh
        emcmake cmake . -DLUAU_BUILD_WEB=ON -DCMAKE_BUILD_TYPE=Release
        make -j2 Luau.Web
