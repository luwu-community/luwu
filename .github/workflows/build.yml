name: build

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'docs/**'
      - 'papers/**'
      - 'rfcs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'papers/**'
      - 'rfcs/**'
      - '*.md'

env:
  SEAL_VERSION: 0.8.1

jobs:
  unix:
    strategy:
      matrix:
        os: [{name: ubuntu, version: ubuntu-latest}]
        compiler: &unix-compilers
          - name: Clang
            cc: clang
            cxx: clang++
          - name: GCC
            cc: gcc
            cxx: g++
    name: ${{matrix.os.name}} with ${{matrix.compiler.name}}
    runs-on: ${{matrix.os.version}}
    steps: &unix-steps
    - uses: actions/checkout@v1
    - name: work around ASLR+ASAN compatibility
      run: sudo sysctl -w vm.mmap_rnd_bits=28
      if: matrix.os.name == 'ubuntu'
    - name: install seal
      # Conformance's ClassesFuzz runs tests/classes_fuzz with seal 0.8.x (>= 0.8.1) and fails without it
      shell: bash
      run: |
        case "${{runner.os}}-${{runner.arch}}" in
          Linux-X64) asset=linux-x64.tar.gz ;;
          Linux-ARM64) asset=linux-arm64.tar.gz ;;
          macOS-ARM64) asset=macos-darwin-arm64.tar.gz ;;
          Windows-X64) asset=windows-x64.zip ;;
          Windows-ARM64) asset=windows-arm64.zip ;;
          *) echo "::error::seal $SEAL_VERSION has no build for ${{runner.os}}-${{runner.arch}}; set LUWU_SKIP_CLASSES_FUZZ=1 for this job"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/seal"
        mkdir -p "$dir"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$dir/$asset" "https://github.com/seal-runtime/seal/releases/download/v$SEAL_VERSION/seal-v$SEAL_VERSION-$asset"
        case "$asset" in
          *.zip) 7z x -y -o"$dir" "$dir/$asset" >/dev/null ;;
          *) tar -xzf "$dir/$asset" -C "$dir" ;;
        esac
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/seal" --version
    - name: make tests
      run: |
        CC=${{matrix.compiler.cc}} CXX=${{matrix.compiler.cxx}} make -j2 config=sanitize werror=1 native=1 luwu-tests
    - name: run tests
      run: |
        ./luwu-tests
        ./luwu-tests --fflags=true
    - name: run extra conformance tests
      run: |
        ./luwu-tests -ts=Conformance -O2
        ./luwu-tests -ts=Conformance -O2 --fflags=true
        ./luwu-tests -ts=Conformance --codegen
        ./luwu-tests -ts=Conformance --codegen --fflags=true
        ./luwu-tests -ts=Conformance --codegen -O2
        ./luwu-tests -ts=Conformance --codegen -O2 --fflags=true
    - name: make cli
      run: |
         make -j2 config=sanitize werror=1 luwu luwu-analyze luwu-compile # match config with tests to improve build time
         ./luwu tests/conformance/assert.luau
         ./luwu-analyze tests/conformance/assert.luau
         ./luwu-compile tests/conformance/assert.luau

  # GitHub gives the org only a few macOS runners. A job that waits too long for one is cancelled ("not acquired by
  # Runner of type hosted"), which fails the PR. This gate holds a run's macOS jobs until it can have MACOS_SLOTS of
  # them running at once. Runs take turns oldest first, and macOS jobs from other workflows count toward the limit.
  macos-gate:
    name: macos gate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      # must match the macos job's max-parallel
      MACOS_SLOTS: 3
    steps:
    - name: wait for free macOS runners
      shell: bash
      run: |
        repo="$GITHUB_REPOSITORY"
        while :; do
          used=0
          for id in $(gh api "repos/$repo/actions/runs?status=in_progress&per_page=100" --jq '.workflow_runs[].id') \
                    $(gh api "repos/$repo/actions/runs?status=queued&per_page=100" --jq '.workflow_runs[].id'); do
            if [ "$id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            # "<macOS jobs not completed> <gate status or none>"
            read -r active gate < <(gh api "repos/$repo/actions/runs/$id/jobs?filter=latest&per_page=100" --jq '
              ([.jobs[] | select(any(.labels[]; test("macos")) and .status != "completed")] | length) as $active
              | ([.jobs[] | select(.name == "macos gate") | .status] | first // "none") as $gate
              | "\($active) \($gate)"') || true
            if [ -z "$gate" ]; then
              # the API call failed: assume the run holds every slot until the next poll
              used=$(( used + MACOS_SLOTS ))
            elif [ "$gate" = "none" ] || [ "$gate" = "completed" ]; then
              # holds its runners: another workflow, or a run whose gate already let it through
              used=$(( used + (active < MACOS_SLOTS ? active : MACOS_SLOTS) ))
            elif [ "$id" -lt "$GITHUB_RUN_ID" ]; then
              # an older run still waiting at its gate goes first
              used=$(( used + MACOS_SLOTS ))
            fi
          done
          # this run's max-parallel takes every slot, so it waits until no other run holds one
          if [ "$used" -eq 0 ]; then
            echo "macOS runners free, starting"
            break
          fi
          echo "$used macOS runners taken or reserved by other runs, waiting"
          sleep 120
        done

  macos:
    needs: macos-gate
    strategy:
      max-parallel: 3
      matrix:
        os: [{name: macos, version: macos-latest}, {name: macos-arm, version: macos-14}]
        compiler: *unix-compilers
    name: ${{matrix.os.name}} with ${{matrix.compiler.name}}
    runs-on: ${{matrix.os.version}}
    steps: *unix-steps

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [Win32, x64]
    steps:
    - uses: actions/checkout@v1
    - name: install seal
      # Conformance's ClassesFuzz runs tests/classes_fuzz with seal 0.8.x (>= 0.8.1) and fails without it
      shell: bash
      run: |
        case "${{runner.os}}-${{runner.arch}}" in
          Linux-X64) asset=linux-x64.tar.gz ;;
          Linux-ARM64) asset=linux-arm64.tar.gz ;;
          macOS-ARM64) asset=macos-darwin-arm64.tar.gz ;;
          Windows-X64) asset=windows-x64.zip ;;
          Windows-ARM64) asset=windows-arm64.zip ;;
          *) echo "::error::seal $SEAL_VERSION has no build for ${{runner.os}}-${{runner.arch}}; set LUWU_SKIP_CLASSES_FUZZ=1 for this job"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/seal"
        mkdir -p "$dir"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$dir/$asset" "https://github.com/seal-runtime/seal/releases/download/v$SEAL_VERSION/seal-v$SEAL_VERSION-$asset"
        case "$asset" in
          *.zip) 7z x -y -o"$dir" "$dir/$asset" >/dev/null ;;
          *) tar -xzf "$dir/$asset" -C "$dir" ;;
        esac
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/seal" --version
    - name: cmake configure
      run: cmake . -A ${{matrix.arch}} -DLUAU_WERROR=ON -DLUAU_NATIVE=ON
    - name: cmake build
      run: cmake --build . --target Luwu.UnitTest Luwu.Conformance --config Debug
    - name: run tests
      shell: bash # necessary for fail-fast
      run: |
        Debug/Luwu.UnitTest.exe
        Debug/Luwu.Conformance.exe
        Debug/Luwu.UnitTest.exe --fflags=true
        Debug/Luwu.Conformance.exe --fflags=true
    - name: run extra conformance tests
      shell: bash # necessary for fail-fast
      run: |
        Debug/Luwu.Conformance.exe -O2
        Debug/Luwu.Conformance.exe -O2 --fflags=true
        Debug/Luwu.Conformance.exe --codegen
        Debug/Luwu.Conformance.exe --codegen --fflags=true
        Debug/Luwu.Conformance.exe --codegen -O2
        Debug/Luwu.Conformance.exe --codegen -O2 --fflags=true
    - name: cmake cli
      shell: bash # necessary for fail-fast
      run: |
        cmake --build . --target Luwu.Repl.CLI Luwu.Analyze.CLI Luwu.Compile.CLI --config Debug # match config with tests to improve build time
        Debug/luwu tests/conformance/assert.luau
        Debug/luwu-analyze tests/conformance/assert.luau
        Debug/luwu-compile tests/conformance/assert.luau

  coverage:
    runs-on: ubuntu-22.04
    env:
      # the classes fuzzer runs in the unix and windows jobs; its luwu processes wouldn't count toward coverage
      LUWU_SKIP_CLASSES_FUZZ: 1
    steps:
    - uses: actions/checkout@v2
    - name: install
      run: |
        sudo apt install llvm
    - name: make coverage
      run: |
        CXX=clang++ make -j2 config=coverage native=1 coverage
    - name: upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.info
        token: ${{ secrets.CODECOV_TOKEN }}

  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - uses: actions/checkout@v2
      with:
        repository: emscripten-core/emsdk
        path: emsdk
    - name: emsdk install
      run: |
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest
    - name: make
      run: |
        source emsdk/emsdk_env.sh
        emcmake cmake . -DLUAU_BUILD_WEB=ON -DCMAKE_BUILD_TYPE=Release
        make -j2 Luwu.Web
