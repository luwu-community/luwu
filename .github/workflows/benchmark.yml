name: benchmark

# TODO: re-enable once luwu.org is hosted, storing results somewhere luwu.org can chart them.
# Inherited from upstream, this pushed results to luau-lang/benchmark-data using their BENCH_GITHUB_TOKEN
# secret, which we don't have, so every push to master failed at "Checkout benchmark results". For now it
# only runs manually and results stay in the job logs; the steps that store and push them are commented out.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - master
  #   paths-ignore:
  #     - "docs/**"
  #     - "papers/**"
  #     - "rfcs/**"
  #     - "*.md"

jobs:
  callgrind:
    strategy:
      matrix:
        os: [ubuntu-22.04]
        benchResultsRepo:
          - { name: "luau-lang/benchmark-data", branch: "main" }

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Luau repository
        uses: actions/checkout@v3

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install valgrind

      - name: Build Luau (gcc)
        run: |
          CXX=g++ make config=profile luwu
          cp luwu luwu-gcc

      - name: Build Luau (codegen)
        run: |
          make config=profile clean
          CXX=clang++ make config=profile native=1 luwu
          cp luwu luwu-codegen

      - name: Build Luau (clang)
        run: |
          make config=profile clean
          CXX=clang++ make config=profile luwu luwu-analyze luwu-compile

      - name: Run benchmark (bench-gcc)
        run: |
          python bench/bench.py --callgrind --vm "./luwu-gcc -O2" | tee -a bench-gcc-output.txt

      - name: Run benchmark (bench)
        run: |
          python bench/bench.py --callgrind --vm "./luwu -O2" | tee -a bench-output.txt

      - name: Run benchmark (bench-codegen)
        run: |
          python bench/bench.py --callgrind --vm "./luwu-codegen --codegen -O2" | tee -a bench-codegen-output.txt

      - name: Run benchmark (analyze)
        run: |
          filter() {
            awk '/.*I\s+refs:\s+[0-9,]+/ {gsub(",", "", $4); X=$4} END {print "SUCCESS: '$1' : " X/1e7 "ms +/- 0% on luwu-analyze"}'
          }
          valgrind --tool=callgrind ./luwu-analyze --mode=nonstrict bench/other/LuauPolyfillMap.lua 2>&1 | filter map-nonstrict | tee -a analyze-output.txt
          valgrind --tool=callgrind ./luwu-analyze --mode=strict bench/other/LuauPolyfillMap.lua 2>&1 | filter map-strict | tee -a analyze-output.txt
          valgrind --tool=callgrind ./luwu-analyze --mode=strict --fflags=LuauSolverV2 bench/other/LuauPolyfillMap.lua 2>&1 | filter map-dcr | tee -a analyze-output.txt
          valgrind --tool=callgrind ./luwu-analyze --mode=nonstrict bench/other/regex.lua 2>&1 | filter regex-nonstrict | tee -a analyze-output.txt
          valgrind --tool=callgrind ./luwu-analyze --mode=strict bench/other/regex.lua 2>&1 | filter regex-strict | tee -a analyze-output.txt
          valgrind --tool=callgrind ./luwu-analyze --mode=strict --fflags=LuauSolverV2 bench/other/regex.lua 2>&1 | filter regex-dcr | tee -a analyze-output.txt

      - name: Run benchmark (compile)
        run: |
          filter() {
            awk '/.*I\s+refs:\s+[0-9,]+/ {gsub(",", "", $4); X=$4} END {print "SUCCESS: '$1' : " X/1e7 "ms +/- 0% on luwu-compile"}'
          }
          valgrind --tool=callgrind ./luwu-compile --null -O0 bench/other/LuauPolyfillMap.lua 2>&1 | filter map-O0 | tee -a compile-output.txt
          valgrind --tool=callgrind ./luwu-compile --null -O1 bench/other/LuauPolyfillMap.lua 2>&1 | filter map-O1 | tee -a compile-output.txt
          valgrind --tool=callgrind ./luwu-compile --null -O2 bench/other/LuauPolyfillMap.lua 2>&1 | filter map-O2 | tee -a compile-output.txt
          valgrind --tool=callgrind ./luwu-compile --codegennull -O2 bench/other/LuauPolyfillMap.lua 2>&1 | filter map-O2-codegen | tee -a compile-output.txt
          valgrind --tool=callgrind ./luwu-compile --codegennull -O2 -t1 bench/other/LuauPolyfillMap.lua 2>&1 | filter map-O2-t1-codegen | tee -a compile-output.txt
          valgrind --tool=callgrind ./luwu-compile --null -O0 bench/other/regex.lua 2>&1 | filter regex-O0 | tee -a compile-output.txt
          valgrind --tool=callgrind ./luwu-compile --null -O1 bench/other/regex.lua 2>&1 | filter regex-O1 | tee -a compile-output.txt
          valgrind --tool=callgrind ./luwu-compile --null -O2 bench/other/regex.lua 2>&1 | filter regex-O2 | tee -a compile-output.txt
          valgrind --tool=callgrind ./luwu-compile --codegennull -O2 bench/other/regex.lua 2>&1 | filter regex-O2-codegen | tee -a compile-output.txt
          valgrind --tool=callgrind ./luwu-compile --codegennull -O2 -t1 bench/other/regex.lua 2>&1 | filter regex-O2-t1-codegen | tee -a compile-output.txt

      # TODO(luwu.org): store results for the website instead of upstream's benchmark-data repo.
